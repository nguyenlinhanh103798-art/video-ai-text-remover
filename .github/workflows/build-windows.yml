
name: Build AI Video Text Remover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AI_Video_Text_Remover main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Text-Remover-Windows
          path: dist/AI_Video_Text_Remover/
          retention-days: 7
